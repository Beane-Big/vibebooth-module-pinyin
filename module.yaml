# 模块清单：平台靠它认识这个模块，规则见 https://github.com/Beane-Big/vibebooth/blob/main/docs/module-spec.md
platform: 1              # 遵循的模块规范版本
id: pinyin               # 全局唯一，也是网址前缀 /apps/pinyin/ 和 /api/pinyin/
name: "拼音练习"
description: "用于孩子练习拼音"
icon: icon.svg
version: 0.2.1           # 发布新版本前改大
services:                # 哪个容器接哪个网址前缀，安装器据此生成网关路由
  frontend: {port: 80}   # 容器 pinyin-frontend → /apps/pinyin/
menus:                   # 模块的页面；管理员在门户“用户”页按人勾选，default 是默认拥有它的角色
  - {id: home, name: "拼音练习", path: /apps/pinyin/, default: [user]}
# requires: [contacts>=0.2]  # 要调用其他模块的对外接口时写上对方
